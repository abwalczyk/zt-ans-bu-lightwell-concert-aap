---
# Concert + AAP + Lightwell Lab Setup -- Master Orchestrator
#
# Runs all setup playbooks in dependency order:
#   Phase 0: Deploy Flask application baseline
#   Phase 1: Configure Tekton pipeline and ArgoCD application
#   Phase 2: Configure AAP Controller resources
#   Phase 3: Configure Concert integration

# ── Phase 0: Application Deployment ──────────────────────────────────
- name: "Phase 0: Deploy Flask application baseline"
  ansible.builtin.import_playbook: deploy-flask-app.yml

# ── Phase 1: Tekton / ArgoCD Configuration ───────────────────────────
- name: "Phase 1: Configure Tekton pipeline and ArgoCD application"
  ansible.builtin.import_playbook: configure-tekton-argocd.yml

# ── Phase 2: Automation Platform ─────────────────────────────────────
- name: "Phase 2: Configure AAP Controller resources"
  ansible.builtin.import_playbook: configure-aap.yml

# ── Phase 2b: EDA Controller ─────────────────────────────────────────
- name: "Phase 2b: Configure EDA Controller (credential, project, activation)"
  ansible.builtin.import_playbook: configure-eda.yml

# ── Phase 3: Artifactory Trigger ─────────────────────────────────────
- name: "Phase 3: Display Artifactory webhook configuration instructions"
  ansible.builtin.import_playbook: configure-artifactory-webhook.yml
