---
# Concert + AAP + Lightwell Lab Setup -- Master Orchestrator
#
# Runs all setup playbooks in dependency order:
#   Phase 0: Deploy Flask application and Gitea
#   Phase 1: Configure Gitea repositories and CI/CD
#   Phase 2: Configure AAP Controller resources
#   Phase 3: Configure Concert Workflow (manual or API-driven)

# ── Phase 0: Application Deployment ──────────────────────────────────
- name: "Phase 0: Deploy Flask application on rhel01"
  ansible.builtin.import_playbook: deploy-flask-app.yml

# ── Phase 1: Gitea Configuration ─────────────────────────────────────
- name: "Phase 1: Configure Gitea and create repositories"
  ansible.builtin.import_playbook: configure-gitea.yml

# ── Phase 2: Automation Platform ─────────────────────────────────────
- name: "Phase 2: Configure AAP Controller resources"
  ansible.builtin.import_playbook: configure-aap.yml

# ── Phase 3: Concert Integration ────────────────────────────────────
- name: "Phase 3: Display Concert Workflow configuration instructions"
  ansible.builtin.import_playbook: configure-concert-workflow.yml
