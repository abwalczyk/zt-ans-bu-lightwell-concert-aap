---
- name: Configure AAP Controller for Concert lab
  hosts: localhost
  gather_facts: false
  connection: local

  vars_files:
    - vars/workshop.yml

  vars:
    controller_oauth_token: "{{ controller_oauth_token_override | default(omit) }}"

  module_defaults:
    group/ansible.controller.controller:
      controller_host: "{{ aap_host }}"
      controller_username: "{{ aap_user }}"
      controller_password: "{{ aap_password }}"
      controller_oauthtoken: "{{ controller_oauth_token | default(omit) }}"
      validate_certs: false

  tasks:
    # ── Credential ─────────────────────────────────────────────────────
    - name: Create machine credential for app server
      ansible.controller.credential:
        name: "{{ workshop_credential_name }}"
        organization: "{{ workshop_org }}"
        credential_type: Machine
        inputs:
          username: rhel
          password: ansible123!
          become_method: sudo
          become_username: root
        state: present

    # ── Project ────────────────────────────────────────────────────────
    - name: Create Concert CVE lab project
      ansible.controller.project:
        name: "{{ workshop_project_name }}"
        organization: "{{ workshop_org }}"
        scm_type: git
        scm_url: "{{ gitea_url }}/{{ gitea_repo }}.git"
        scm_update_on_launch: false
        state: present
      register: _project

    - name: Sync project from SCM
      ansible.controller.project_update:
        project: "{{ workshop_project_name }}"
        wait: true
        timeout: 120

    # ── Inventory ──────────────────────────────────────────────────────
    - name: Create Concert lab inventory
      ansible.controller.inventory:
        name: "{{ workshop_inventory_name }}"
        organization: "{{ workshop_org }}"
        variables:
          ansible_become: true
          target_cve: "{{ target_cve }}"
          vulnerable_package: "{{ vulnerable_package }}"
          vulnerable_version: "{{ vulnerable_version }}"
          fixed_version: "{{ fixed_version }}"
        state: present

    - name: Add appservers group
      ansible.controller.group:
        name: appservers
        inventory: "{{ workshop_inventory_name }}"
        variables:
          app_port: "{{ app_port }}"
        state: present

    - name: Add rhel01 host
      ansible.controller.host:
        name: "{{ app_server_host }}"
        inventory: "{{ workshop_inventory_name }}"
        variables:
          ansible_host: "{{ app_server_host }}"
        state: present

    - name: Add rhel01 to appservers group
      ansible.controller.group:
        name: appservers
        inventory: "{{ workshop_inventory_name }}"
        hosts:
          - "{{ app_server_host }}"
        state: present

    # ── Job Templates - Concert Inventory & Topology Queries ───────────
    - name: Create job template - Concert SBOM Inventory
      ansible.controller.job_template:
        name: "Concert - Query SBOM Inventory"
        organization: "{{ workshop_org }}"
        job_type: run
        inventory: "{{ workshop_inventory_name }}"
        project: "{{ workshop_project_name }}"
        playbook: lab/playbooks/concert/query-sbom-inventory.yml
        credentials:
          - "{{ workshop_credential_name }}"
        execution_environment: "{{ workshop_ee_name }}"
        ask_variables_on_launch: true
        extra_vars:
          cve_id: "{{ target_cve }}"
          target_app: "{{ target_app }}"
        state: present

    - name: Create job template - Concert Arena View Topology
      ansible.controller.job_template:
        name: "Concert - Query Topology"
        organization: "{{ workshop_org }}"
        job_type: run
        inventory: "{{ workshop_inventory_name }}"
        project: "{{ workshop_project_name }}"
        playbook: lab/playbooks/concert/query-topology.yml
        credentials:
          - "{{ workshop_credential_name }}"
        execution_environment: "{{ workshop_ee_name }}"
        ask_variables_on_launch: true
        extra_vars:
          application: "{{ target_app }}"
        state: present

    # ── Job Templates - Remediation Execution ──────────────────────────
    - name: Create job template - Fetch Lightwell Artifact
      ansible.controller.job_template:
        name: "Concert - Fetch Lightwell Artifact"
        organization: "{{ workshop_org }}"
        job_type: run
        inventory: "{{ workshop_inventory_name }}"
        project: "{{ workshop_project_name }}"
        playbook: lab/playbooks/aap/fetch-lightwell-artifact.yml
        credentials:
          - "{{ workshop_credential_name }}"
        execution_environment: "{{ workshop_ee_name }}"
        ask_variables_on_launch: true
        extra_vars:
          cve_id: "{{ target_cve }}"
          package_name: "{{ vulnerable_package }}"
        state: present

    - name: Create job template - Update Dependency in Gitea
      ansible.controller.job_template:
        name: "Concert - Update Dependency in Gitea"
        organization: "{{ workshop_org }}"
        job_type: run
        inventory: "{{ workshop_inventory_name }}"
        project: "{{ workshop_project_name }}"
        playbook: lab/playbooks/aap/update-dependency-gitea.yml
        credentials:
          - "{{ workshop_credential_name }}"
        execution_environment: "{{ workshop_ee_name }}"
        ask_variables_on_launch: true
        extra_vars:
          cve_id: "{{ target_cve }}"
          fixed_version: "{{ fixed_version }}"
        state: present

    - name: Create job template - Validate Remediation
      ansible.controller.job_template:
        name: "Concert - Validate Remediation"
        organization: "{{ workshop_org }}"
        job_type: run
        inventory: "{{ workshop_inventory_name }}"
        project: "{{ workshop_project_name }}"
        playbook: lab/playbooks/validation/validate-remediation.yml
        credentials:
          - "{{ workshop_credential_name }}"
        execution_environment: "{{ workshop_ee_name }}"
        ask_variables_on_launch: true
        extra_vars:
          cve_id: "{{ target_cve }}"
          expected_version: "{{ fixed_version }}"
        state: present

    # ── Job Templates - Concert Inventory Update ───────────────────────
    - name: Create job template - Update Concert Inventory
      ansible.controller.job_template:
        name: "Concert - Update Inventory"
        organization: "{{ workshop_org }}"
        job_type: run
        inventory: "{{ workshop_inventory_name }}"
        project: "{{ workshop_project_name }}"
        playbook: lab/playbooks/concert/update-inventory.yml
        credentials:
          - "{{ workshop_credential_name }}"
        execution_environment: "{{ workshop_ee_name }}"
        ask_variables_on_launch: true
        extra_vars:
          application: "{{ target_app }}"
          package: "{{ vulnerable_package }}"
          previous_version: "{{ vulnerable_version }}"
          new_version: "{{ fixed_version }}"
        state: present

    # ── Automation Orchestrator Workflow ───────────────────────────────
    # Note: This workflow is triggered by EDA (Event-Driven Ansible)
    # Concert provides SBOM inventory and topology data, AO orchestrates remediation
    - name: Create Concert CVE Remediation workflow
      ansible.controller.workflow_job_template:
        name: "CVE Remediation Orchestrator"
        organization: "{{ workshop_org }}"
        inventory: "{{ workshop_inventory_name }}"
        ask_variables_on_launch: true
        extra_vars:
          cve_id: "{{ target_cve }}"
        state: present
      register: _workflow

    # Phase 1: Concert Inventory & Topology Queries
    - name: Add workflow node - Concert SBOM Inventory
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: concert_sbom
        unified_job_template: "Concert - Query SBOM Inventory"
        state: present
      register: _node_sbom

    - name: Add workflow node - Concert Arena View Topology
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: concert_topology
        unified_job_template: "Concert - Query Topology"
        state: present
      register: _node_topology

    # Phase 2: Remediation Execution
    - name: Add workflow node - Fetch Lightwell Artifact
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: fetch_lightwell
        unified_job_template: "Concert - Fetch Lightwell Artifact"
        state: present
      register: _node_fetch

    - name: Add workflow node - Update Dependency
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: update_dependency
        unified_job_template: "Concert - Update Dependency in Gitea"
        state: present
      register: _node_update

    - name: Add workflow node - Validate Remediation
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: validate_remediation
        unified_job_template: "Concert - Validate Remediation"
        state: present
      register: _node_validate

    # Phase 3: Concert Inventory Update
    - name: Add workflow node - Update Concert Inventory
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: update_concert
        unified_job_template: "Concert - Update Inventory"
        state: present
      register: _node_concert_update

    # Workflow Links
    - name: Link SBOM → Topology
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: concert_topology
        success_nodes:
          - concert_sbom
        state: present

    - name: Link Topology → Fetch Lightwell
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: fetch_lightwell
        success_nodes:
          - concert_topology
        state: present

    - name: Link Fetch → Update Dependency
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: update_dependency
        success_nodes:
          - fetch_lightwell
        state: present

    - name: Link Update → Validate
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: validate_remediation
        success_nodes:
          - update_dependency
        state: present

    - name: Link Validate → Update Concert Status
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "CVE Remediation Orchestrator"
        identifier: update_concert
        success_nodes:
          - validate_remediation
        state: present

    - name: Display workflow information
      ansible.builtin.debug:
        msg:
          - "CVE Remediation Orchestrator workflow created"
          - "Workflow ID: {{ _workflow.id }}"
          - "Workflow URL: {{ aap_host }}/#/templates/workflow_job_template/{{ _workflow.id }}"
          - "Triggered by: EDA rulebook (lab/extensions/eda/cve-alert.yml)"
          - "Concert role: SBOM inventory database + dependency topology mapping"
          - "AO role: Orchestration, decision logic, remediation execution"
