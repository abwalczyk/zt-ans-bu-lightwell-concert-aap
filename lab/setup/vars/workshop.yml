---
# Concert + AAP + Lightwell Lab -- Workshop Setup Variables
# Referenced by all setup playbooks via vars_files

# CVE and application targeting
target_cve: CVE-2026-52891
target_cwe: CWE-502
vulnerable_package: pyyaml
vulnerable_version: "5.4.1"
fixed_version: "6.0.2"
target_app: flask-api-app

# Workshop scenario
company_name: "Concert Demo Corp"
app_port: 80
gitea_port: 3000

# AAP Controller (shared or per-lab)
aap_host: "https://{{ hostvars['control']['ansible_host'] | default('control') }}"
aap_user: admin
aap_password: "{{ aap_admin_password | default('ansible123!') }}"

# Host references
app_server_host: rhel01
control_host: control

# AAP resource names
workshop_org: Default
workshop_project_name: "Concert CVE Remediation"
workshop_inventory_name: "Concert Lab Inventory"
workshop_credential_name: "Lab Machine Credential"
workshop_ee_name: "Default execution environment"

# Gitea SCM
gitea_url: "http://gitea:3000"
gitea_repo: "labuser/flask-api-app"
gitea_admin_user: gitea
gitea_admin_password: ansible123!
gitea_lab_user: labuser
gitea_lab_password: ansible123!

# Concert (shared cloud instance)
concert_api_url: "{{ lookup('env', 'CONCERT_API_URL') }}"
concert_api_token: "{{ lookup('env', 'CONCERT_API_TOKEN') }}"
concert_workflow_name: "Concert-AAP CVE Remediation Handler"

# Lightwell (shared service)
lightwell_api_url: "{{ lookup('env', 'LIGHTWELL_API_URL') }}"
lightwell_api_token: "{{ lookup('env', 'LIGHTWELL_API_TOKEN') }}"

# Flask application paths
flask_app_dir: /opt/flask-app
flask_app_user: labuser
flask_app_service: flask-app

# Lab identification
lab_id: "{{ lookup('env', 'LAB_ID') | default('lab-01', true) }}"
