---
# EDA Rulebook: Lightwell Package Ingestion
# Receives Artifactory webhook events when a new Lightwell remediated package is
# published, and hands them to the Automation Orchestrator workflow that
# lab/setup/configure-ao.yml published for this lab.
# Path: extensions/eda/rulebooks/ (EDA project sync convention)

- name: Lightwell Package Processing
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Trigger AO Workflow on new Lightwell package
      condition: >-
        event.payload.package_name is defined and
        event.payload.package_version is defined and
        event.payload.repository is search("lightwell")
      # AO owns the orchestration -- routing, the approval gate and the audit
      # trail all live in the AO workflow, not here. EDA cannot POST to AO
      # directly (rulebook actions launch templates, not HTTP calls), so this
      # job template is a one-task relay onto the AO webhook.
      action:
        run_job_template:
          name: "AO - Trigger Proactive Update Workflow"
          organization: "Default"
          job_args:
            extra_vars:
              package_name: "{{ event.payload.package_name }}"
              package_version: "{{ event.payload.package_version }}"
              previous_version: "{{ event.payload.previous_version | default('') }}"
              artifact_id: "{{ event.payload.artifact_id | default('') }}"
              artifact_url: "{{ event.payload.artifact_url | default('') }}"
              artifact_checksum: "{{ event.payload.checksum | default('') }}"
              source_repository: "{{ event.payload.repository }}"
              fixes_cve: "{{ event.payload.remediation_info.fixes_cve | default('') }}"
              severity: "{{ event.payload.remediation_info.severity | default('unknown') }}"
