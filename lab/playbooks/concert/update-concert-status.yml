---
# Update Concert CVE status after remediation
# Marks CVE as RESOLVED for a specific application
#
# Required extra vars:
#   cve_id: CVE identifier (e.g., CVE-2026-52891)
#   application: Application name (e.g., flask-api-app)
#   deployed_version: Version deployed after remediation
#   validation_passed: Boolean indicating validation success
#   ao_workflow_id: Automation Orchestrator workflow execution ID

- name: Update Concert CVE Status
  hosts: localhost
  gather_facts: false
  vars:
    concert_url: "{{ lookup('env', 'CONCERT_URL') | default('https://concert.example.com') }}"
    concert_api_key: "{{ lookup('env', 'CONCERT_API_KEY') }}"
    cve_id: "{{ cve_id }}"
    application: "{{ application }}"
    deployed_version: "{{ deployed_version }}"
    validation_passed: "{{ validation_passed | default(false) }}"
    ao_workflow_id: "{{ ao_workflow_id | default('') }}"

  tasks:
    - name: Update Concert CVE status to RESOLVED
      ansible.builtin.uri:
        url: "{{ concert_url }}/api/v1/vulnerabilities/{{ cve_id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ concert_api_key }}"
          Content-Type: "application/json"
        body_format: json
        body:
          application: "{{ application }}"
          status: "resolved"
          remediation_method: "lightwell_artifact"
          deployed_version: "{{ deployed_version }}"
          validation_passed: "{{ validation_passed }}"
          remediation_timestamp: "{{ ansible_date_time.iso8601 }}"
          ao_workflow_id: "{{ ao_workflow_id }}"
        validate_certs: false
        status_code: [200, 204]
      register: concert_update_response

    - name: Display Concert update results
      ansible.builtin.debug:
        msg: |
          Concert Status Updated:
          CVE ID: {{ cve_id }}
          Application: {{ application }}
          Status: RESOLVED
          Deployed Version: {{ deployed_version }}
          Validation: {{ 'PASSED' if validation_passed else 'FAILED' }}
          AO Workflow: {{ ao_workflow_id }}
