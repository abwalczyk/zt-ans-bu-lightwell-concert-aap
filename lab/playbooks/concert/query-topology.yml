---
# Query Concert Arena View (Topology)
# Gets application deployment topology and downstream dependencies
#
# Concert's Unique Value:
#   - Cross-application dependency mapping (what breaks if you patch this)
#   - Enterprise-wide topology (apps owned by different teams)
#
# Required extra vars:
#   application: Application name (e.g., flask-api-app)
#
# Returns (via set_stats):
#   concert_deployments: List of deployment environments
#   concert_deployment_count: Total number of deployments
#   concert_has_prod_deployment: Boolean (whether app is deployed to production)
#   concert_downstream_dependencies: List of apps that depend on this one
#   concert_dependency_count: Number of downstream dependencies

- name: Query Concert Arena View Topology
  hosts: localhost
  gather_facts: false
  vars:
    concert_url: "{{ concert_api_url | default('', true) }}"
    concert_api_key: "{{ lookup('env', 'CONCERT_API_TOKEN') | default('', true) }}"
    concert_instance_id: "{{ concert_instance_id | default('0000-0000-0000-0000', true) }}"
    application: "{{ application | default('flask-api-app') }}"
    demo_mode: "{{ lab_demo_mode | default(true) | bool }}"
    # Drives the AO routing decision. 0 downstream consumers -> the impact agent
    # picks auto_update and the workflow runs straight through to the audit
    # summary. Set to 1 or more to demo the human approval branch instead.
    demo_downstream_count: "{{ demo_downstream | default(0) | int }}"

  tasks:
    - name: Query Concert Arena View for application topology
      ansible.builtin.uri:
        url: "{{ concert_url }}/applications/{{ application }}/topology"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ concert_api_key }}"
          InstanceId: "{{ concert_instance_id }}"
          Content-Type: "application/json"
        validate_certs: false
        status_code: 200
      register: concert_topology_response
      when: not demo_mode

    - name: Parse Concert topology response
      ansible.builtin.set_fact:
        topology_data: "{{ concert_topology_response.json }}"
      when: not demo_mode

    - name: Build representative Concert topology (demo mode)
      ansible.builtin.set_fact:
        topology_data:
          application: "{{ application }}"
          repository: "{{ app_repo_url | default('https://github.com/labuser/flask-api-app') }}"
          build_artifacts:
            - type: container_image
              image: "{{ container_registry | default('quay.io/labuser') }}/{{ application }}:v1.0.0"
          deployments:
            - environment: production
              namespace: production
              replicas: 3
            - environment: staging
              namespace: staging
              replicas: 1
          downstream_dependencies: >-
            {{ [{'name': 'api-gateway', 'owner_team': 'network-team'}][:demo_downstream_count | int] }}
      when: demo_mode

    - name: Note that these results are representative
      ansible.builtin.debug:
        msg: >-
          DEMO MODE: Concert Arena View was not queried. Topology is
          representative lab data ({{ demo_downstream_count }} downstream
          consumer(s), so AO will route to
          {{ 'approval_required' if demo_downstream_count | int > 0 else 'auto_update' }}).
      when: demo_mode

    - name: Check for production deployment
      ansible.builtin.set_fact:
        has_prod: "{{ topology_data.deployments | selectattr('environment', 'equalto', 'production') | list | length > 0 }}"

    - name: Set workflow stats for topology
      ansible.builtin.set_stats:
        data:
          concert_deployments: "{{ topology_data.deployments | default([]) }}"
          concert_deployment_count: "{{ topology_data.deployments | default([]) | length }}"
          concert_has_prod_deployment: "{{ has_prod }}"
          concert_downstream_dependencies: "{{ topology_data.downstream_dependencies | default([]) }}"
          concert_dependency_count: "{{ topology_data.downstream_dependencies | default([]) | length }}"
          concert_repository: "{{ topology_data.repository | default('') }}"

    - name: Display Concert topology results
      ansible.builtin.debug:
        msg: |
          ==========================================
          Concert Arena View Topology
          ==========================================
          Application: {{ application }}
          Repository: {{ topology_data.repository | default('N/A') }}

          BUILD ARTIFACTS:
          {% for artifact in topology_data.build_artifacts | default([]) %}
          - Type: {{ artifact.type }}, Image: {{ artifact.image | default('N/A') }}
          {% endfor %}

          DEPLOYMENTS:
          Total Deployments: {{ topology_data.deployments | default([]) | length }}
          {% for deploy in topology_data.deployments | default([]) %}
          - Environment: {{ deploy.environment }}
            Namespace: {{ deploy.namespace | default('N/A') }}
            Replicas: {{ deploy.replicas | default('N/A') }}
          {% endfor %}

          DOWNSTREAM DEPENDENCIES:
          Total Dependencies: {{ topology_data.downstream_dependencies | default([]) | length }}
          {% for dep in topology_data.downstream_dependencies | default([]) %}
          - {{ dep.name }} (owned by {{ dep.owner_team | default('unknown') }})
          {% endfor %}

          {% if topology_data.downstream_dependencies | default([]) | length > 0 %}
          ⚠️  WARNING: Patching this app may affect {{ topology_data.downstream_dependencies | length }} downstream dependencies!
          {% endif %}
          ==========================================
