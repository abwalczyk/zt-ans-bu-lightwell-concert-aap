# lab-metadata.yml
# Single Point of Truth for Lab Information

lab:
  name: "Concert + AAP + Lightwell CVE Remediation"
  shortname: "zt-ans-bu-lightwell-concert-aap"
  maintainer: "Red Hat TMM (placeholder@redhat.com)"

  description:
    summary: "AI-driven CVE remediation with IBM Concert intelligence, Ansible Automation Platform orchestration, and Red Hat Lightwell"
    goal: "Demonstrate EDA-triggered CVE remediation orchestrated by Automation Orchestrator, with Concert as an intelligence source for SBOM correlation and risk assessment"
    concepts:
     - "Event-Driven Ansible (EDA) for CVE alert ingestion"
     - "Automation Orchestrator workflow design and execution"
     - "IBM Concert as intelligence source (SBOM correlation, risk scoring)"
     - "Red Hat Lightwell remediated dependencies"
     - "Gitea CI/CD pipeline integration"
     - "End-to-end CVE remediation with audit trail"
    use_case: "Event-driven automated CVE remediation from alert to validation with Concert intelligence"
    time_to_complete: "90"

  git_ref:
    production: "v1.0.0"
    development: "main"

# DYNAMIC EXTRACTION SOURCES:
# ===========================
#
# GENERATED FILES:
# description.adoc: Generated from lab.description (goal, concepts, use_case)
# README.md: Generated from configuration extraction (maintainer, summary, instances, networks, firewall)
# dev.yaml: Generated using git_ref.development (defaults to "main" if not specified)
# prod.yaml: Generated using git_ref.production (required)
