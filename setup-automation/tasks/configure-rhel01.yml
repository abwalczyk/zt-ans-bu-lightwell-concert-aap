---
# Configure rhel01 — deploy and start Flask application only
# Gitea is the container from config/instances.yaml (route host: gitea)

- name: Deploy Flask application files
  ansible.builtin.template:
    src: "../../lab/templates/{{ item }}.j2"
    dest: "/opt/flask-app/{{ item }}"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: '0644'
  loop:
    - app.py
    - requirements.txt
  tags: flask

- name: Install Flask application dependencies
  ansible.builtin.pip:
    requirements: /opt/flask-app/requirements.txt
    state: present
  tags: flask

- name: Create Flask systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/flask-app.service
    content: |
      [Unit]
      Description=Flask API Application
      After=network.target

      [Service]
      User={{ lab_user }}
      WorkingDirectory=/opt/flask-app
      ExecStart=/usr/bin/python3 /opt/flask-app/app.py
      Restart=always
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      NoNewPrivileges=true

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  tags: flask

- name: Start and enable Flask application
  ansible.builtin.systemd:
    name: flask-app
    state: started
    enabled: true
    daemon_reload: true
  tags: flask

- name: Wait for Flask application to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port | default(80) }}/version"
    status_code: 200
  register: flask_ready
  until: flask_ready is success
  retries: 15
  delay: 2
  tags: flask
