---
# Configure AAP Controller on control
# Wait for AAP, generate OAuth token, run lab setup playbooks

# This CEH image exposes the classic controller API on localhost.
# Do not use https://control here — that hostname often resolves to eth1
# while the gateway/listener is on localhost.

- name: Wait for AAP Controller API to be ready
  ansible.builtin.uri:
    url: "https://control/api/controller/v2/ping/"
    method: GET
    user: admin
    password: "ansible123!"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_ping
  retries: 60
  delay: 10
  until: _aap_ping.status == 200

- name: Generate AAP OAuth token
  ansible.builtin.uri:
    url: https://control/api/controller/v2/tokens/
    method: POST
    user: admin
    password: "ansible123!"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      description: "concert-lab-setup-automation"
      application: null
      scope: "write"
    status_code: 201
  register: _aap_token

- name: Validate OAuth token was generated
  ansible.builtin.assert:
    that:
      - _aap_token.json.token is defined
      - _aap_token.json.token | length > 0
    fail_msg: "Failed to generate AAP OAuth token."

- name: Set OAuth token fact
  ansible.builtin.set_fact:
    controller_oauth_token: "{{ _aap_token.json.token }}"

- name: Configure AAP Controller
  ansible.builtin.command:
    cmd: >-
      ansible-playbook lab/setup/configure-aap.yml
      -i lab/inventory/workshop.yml
      -e "controller_oauth_token_override={{ controller_oauth_token }}"
      -e "ansible_ssh_pass={{ hostvars[inventory_hostname].ansible_ssh_pass | default('ansible123!') }}"
      -e "workshop_guid={{ guid | default('') }}"
      -e "workshop_domain={{ domain | default('') }}"
    chdir: "{{ workshop_repo_dest }}"
  environment:
    ANSIBLE_HOST_KEY_CHECKING: "False"
  register: _aap_config
  changed_when: true

# Must follow the AAP step: AO resolves this lab's job templates by name, so
# they have to exist before the AO workflow can be rendered and published.
# Skips itself cleanly if no AO service account is configured.
- name: Bind lab to Automation Orchestrator
  ansible.builtin.command:
    cmd: >-
      ansible-playbook lab/setup/configure-ao.yml
      -i lab/inventory/workshop.yml
      -e "controller_oauth_token_override={{ controller_oauth_token }}"
      -e "ansible_ssh_pass={{ hostvars[inventory_hostname].ansible_ssh_pass | default('ansible123!') }}"
      -e "workshop_guid={{ guid | default('') }}"
      -e "workshop_domain={{ domain | default('') }}"
    chdir: "{{ workshop_repo_dest }}"
  environment:
    ANSIBLE_HOST_KEY_CHECKING: "False"
    # Passed through rather than put on the command line so the client secret
    # does not land in the process list.
    GUID: "{{ guid | default('') }}"
    DOMAIN: "{{ domain | default('') }}"
    AO_URL: "{{ lookup('ansible.builtin.env', 'AO_URL') }}"
    AO_CLIENT_ID: "{{ lookup('ansible.builtin.env', 'AO_CLIENT_ID') }}"
    AO_CLIENT_SECRET: "{{ lookup('ansible.builtin.env', 'AO_CLIENT_SECRET') }}"
  register: _ao_config
  changed_when: true
  # A shared external service should not be able to fail the lab build.
  failed_when: false
  tags:
    - ao

- name: Report AO binding result
  ansible.builtin.debug:
    msg: "{{ _ao_config.stdout_lines | default([]) | select('search', 'AO |webhook|skipping') | list }}"
  tags:
    - ao

- name: Configure EDA Controller (credential and project)
  ansible.builtin.command:
    cmd: >-
      ansible-playbook lab/setup/configure-eda.yml
      -i lab/inventory/workshop.yml
      -e "controller_oauth_token_override={{ controller_oauth_token }}"
      -e "ansible_ssh_pass={{ hostvars[inventory_hostname].ansible_ssh_pass }}"
    chdir: "{{ workshop_repo_dest }}"
  environment:
    ANSIBLE_HOST_KEY_CHECKING: "False"
  register: _eda_config
  changed_when: true
  tags:
    - eda
