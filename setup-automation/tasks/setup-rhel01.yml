---
# Setup tasks for rhel01 (Flask application server only)
# Gitea runs as a container from config/instances.yaml — do not install it here

- name: Install Python development packages
  ansible.builtin.dnf:
    name:
      - python3
      - python3-devel
      - python3-pip
      - gcc
      - git
    state: present

- name: Create lab user
  ansible.builtin.user:
    name: "{{ lab_user }}"
    comment: Lab User
    shell: /bin/bash
    create_home: true

- name: Create Flask application directory
  ansible.builtin.file:
    path: /opt/flask-app
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: '0755'

- name: Open firewall ports for Flask
  ansible.builtin.command: "firewall-cmd --permanent --add-port={{ item }}"
  loop:
    - 80/tcp
  changed_when: true
  failed_when: false

- name: Reload firewall
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
  failed_when: false
