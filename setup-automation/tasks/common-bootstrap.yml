---
# Common bootstrap tasks for all RHEL hosts
# Sets up SSH, networking, RHSM, packages

- name: Wait for SSH connectivity
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 300

- name: Gather facts
  ansible.builtin.setup:

- name: Configure static network
  community.general.nmcli:
    conn_name: "{{ net_interface }}"
    ifname: "{{ net_interface }}"
    type: ethernet
    ip4: "{{ net_address }}"
    state: present
  when: net_interface is defined and net_address is defined

- name: Set hostname entries
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.names | join(' ') }}"
    state: present
  loop: "{{ hosts_entries }}"
  when: hosts_entries is defined

- name: Set SELinux mode
  ansible.posix.selinux:
    policy: targeted
    state: "{{ selinux_mode }}"
  when: selinux_mode is defined

- name: Register with Red Hat Subscription Manager
  community.general.redhat_subscription:
    state: present
    username: "{{ rhsm_username }}"
    password: "{{ rhsm_password }}"
    auto_attach: true
  when: rhsm_username is defined and rhsm_password is defined
  ignore_errors: true

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - git
      - vim
      - wget
      - curl
      - python3-pip
      - podman
      - firewalld
    state: present

- name: Start and enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
