---
# Configure AAP Controller (legacy include path)
# Prefer lab/setup/configure-aap.yml via configure-control.yml

- name: Wait for AAP Controller to be ready
  ansible.builtin.uri:
    url: "https://control/api/controller/v2/ping/"
    validate_certs: false
    status_code: 200
  register: aap_ping
  until: aap_ping is success
  retries: 30
  delay: 10
  tags: aap

- name: Create AAP credential for app server
  ansible.controller.credential:
    name: Lab Machine Credential
    description: SSH credential for rhel01 application server
    organization: Default
    credential_type: Machine
    inputs:
      username: rhel
      password: ansible123!
      become_password: ansible123!
    controller_host: https://localhost
    controller_username: admin
    controller_password: ansible123!
    validate_certs: false
  tags: aap

- name: Create AAP project
  ansible.controller.project:
    name: Concert CVE Remediation
    description: Concert + AAP + Lightwell lab playbooks
    organization: Default
    scm_type: git
    scm_url: http://gitea:3000/labuser/flask-api-app.git
    scm_branch: main
    scm_update_on_launch: true
    controller_host: https://localhost
    controller_username: admin
    controller_password: ansible123!
    validate_certs: false
  tags: aap

- name: Create lab inventory
  ansible.controller.inventory:
    name: Concert Lab Inventory
    description: Flask application server (rhel01)
    organization: Default
    controller_host: https://localhost
    controller_username: admin
    controller_password: ansible123!
    validate_certs: false
  tags: aap

- name: Add rhel01 host to inventory
  ansible.controller.host:
    name: rhel01
    description: Flask application server
    inventory: Concert Lab Inventory
    variables:
      ansible_host: rhel01
      ansible_user: rhel
    controller_host: https://localhost
    controller_username: admin
    controller_password: ansible123!
    validate_certs: false
  tags: aap
