---
# Secrets and credentials for lab environment
# In production, these would be encrypted with ansible-vault

# Red Hat Subscription Manager
rhsm_username: "{{ lookup('env', 'RHSM_USERNAME') }}"
rhsm_password: "{{ lookup('env', 'RHSM_PASSWORD') }}"

# AAP Controller credentials
aap_admin_username: admin
aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') | default('ansible123!', true) }}"
aap_oauth_token: "{{ lookup('env', 'AAP_OAUTH_TOKEN') | default('', true) }}"

# Concert credentials
concert_api_url: "{{ lookup('env', 'CONCERT_API_URL') }}"
concert_api_token: "{{ lookup('env', 'CONCERT_API_TOKEN') }}"
concert_workflow_id: "{{ lookup('env', 'CONCERT_WORKFLOW_ID') | default('', true) }}"

# Lightwell credentials
lightwell_api_url: "{{ lookup('env', 'LIGHTWELL_API_URL') }}"
lightwell_api_token: "{{ lookup('env', 'LIGHTWELL_API_TOKEN') }}"

# Gitea credentials
gitea_admin_username: gitea
gitea_admin_password: ansible123!
gitea_user_username: labuser
gitea_user_password: ansible123!

# Lab user credentials
lab_user: labuser
lab_password: ansible123!

# SSH keys (if needed)
lab_ssh_private_key: "{{ lookup('env', 'LAB_SSH_PRIVATE_KEY') | default('', true) }}"
lab_ssh_public_key: "{{ lookup('env', 'LAB_SSH_PUBLIC_KEY') | default('', true) }}"

