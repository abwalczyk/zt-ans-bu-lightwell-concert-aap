---
# Firewall rules for Concert + AAP + Lightwell lab

# Flask application access
- port: 5000/tcp
  source: 0.0.0.0/0
  zone: public
  state: enabled

# Gitea web interface
- port: 3000/tcp
  source: 0.0.0.0/0
  zone: public
  state: enabled

# AAP Controller (if deployed per-lab)
- port: 443/tcp
  source: 0.0.0.0/0
  zone: public
  state: enabled

# SSH access
- port: 22/tcp
  source: 0.0.0.0/0
  zone: public
  state: enabled

# HTTP/HTTPS for general access
- port: 80/tcp
  source: 0.0.0.0/0
  zone: public
  state: enabled

- port: 8080/tcp
  source: 0.0.0.0/0
  zone: public
  state: enabled
